# Render Blueprint — deploys Pixel Paper as a single Node web service.
# Spec: https://render.com/docs/blueprint-spec
#
# One service builds the client into dist/ and bundles the server into
# build/server.cjs, then runs that bundle. The same process serves both the API
# and the built SPA — server.ts switches on NODE_ENV=production to serve dist/.
#
# The five secrets below are declared with `sync: false`: their VALUES are not
# stored in this file or in git. Render prompts for them once in the dashboard
# when the Blueprint is first applied, and remembers them thereafter.
services:
  - type: web
    name: the-internet-times
    runtime: node
    plan: free
    # --include=dev forces Vite/esbuild/tsx to install even though NODE_ENV is
    # production. Without it npm skips devDependencies and the build dies with
    # "vite: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Render restarts the service if this stops returning 200. /api/health also
    # reports database + payments readiness, so a green check means fully wired.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Dodo talks to test mode unless this says otherwise. Kept in-file (not a
      # secret) so a Blueprint deploy never accidentally charges real cards.
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: PUBLIC_BASE_URL
        value: https://pixelpaper.lol
      # Supabase's CA certificate is required for verified PostgreSQL TLS.
      - key: DATABASE_SSL_CA
        sync: false
      # PORT is intentionally omitted — Render injects it and the server reads it.
      # Values entered in the Render dashboard, never committed:
      - key: DATABASE_URL
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PRODUCT_ID
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
